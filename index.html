<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Variant-R — Wildfire &amp; Atmospheric Smoke</title>
  <meta name="description" content="Variant-R: wildfire activity, local community fire risk, atmospheric smoke emissions, and 2027–2035 outlook across Canada, the USA and Russia.">
  <meta property="og:title" content="Variant-R — Wildfire &amp; Atmospheric Smoke">
  <meta property="og:description" content="Variant-R: wildfire activity, local community fire risk, atmospheric smoke emissions, and 2027–2035 outlook across Canada, the USA and Russia.">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cpath d='M16 4c3 5 7 8 7 14a7 7 0 0 1-14 0c0-3 1-5 3-7 0 3 1 4 3 5 0-4 0-8 1-12z' fill='%23D55E00'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

  <!-- MapLibre GL 5 + maplibre-contour 0.1.0; Observable Plot is imported by the chart modules. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <script defer src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script defer src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <main class="page">
    <header id="site-header" class="slot" aria-label="Site header">
      <div class="vr-loading"><span class="vr-spinner" aria-hidden="true"></span><span>Loading header…</span></div>
    </header>

    <div id="year-slider" class="slot" aria-label="Year slider">
      <div class="vr-loading"><span class="vr-spinner" aria-hidden="true"></span><span>Loading timeline…</span></div>
    </div>

    <aside id="map-legend" class="slot" aria-label="Map legend and severity guide">
      <div class="vr-loading"><span class="vr-spinner" aria-hidden="true"></span><span>Loading telemetry…</span></div>
    </aside>

    <figure id="map" class="slot" aria-label="Interactive wildfire globe">
      <div class="vr-loading"><span class="vr-spinner" aria-hidden="true"></span><span>Loading map…</span></div>
    </figure>

    <figure id="fig1" class="slot" aria-label="Historical fire and smoke trend">
      <div class="vr-loading"><span class="vr-spinner" aria-hidden="true"></span><span>Loading historical trend…</span></div>
    </figure>

    <section id="local-risk" class="slot" aria-label="Local fire risk near you">
      <div class="vr-loading"><span class="vr-spinner" aria-hidden="true"></span><span>Loading local fire risk estimator…</span></div>
    </section>

    <aside id="infobox" class="slot" aria-label="National wildfire archive table">
      <div class="vr-loading"><span class="vr-spinner" aria-hidden="true"></span><span>Loading archive summary…</span></div>
    </aside>

    <figure id="fig2" class="slot" aria-label="Before and after fire-year comparison">
      <div class="vr-loading"><span class="vr-spinner" aria-hidden="true"></span><span>Loading before vs. after comparison…</span></div>
    </figure>

    <section id="forests-panel" class="slot" aria-label="Active forests and sensor telemetry">
      <div class="vr-loading"><span class="vr-spinner" aria-hidden="true"></span><span>Loading active forests &amp; sensors…</span></div>
    </section>

    <figure id="fig3" class="slot" aria-label="Combustion plume and atmospheric footprint">
      <div class="vr-loading"><span class="vr-spinner" aria-hidden="true"></span><span>Loading smoke footprint…</span></div>
    </figure>

    <section id="outlook" class="slot" aria-label="Wildfire outlook and methodology">
      <div class="vr-loading"><span class="vr-spinner" aria-hidden="true"></span><span>Loading outlook &amp; AI analyst…</span></div>
    </section>
  </main>
  <noscript><p class="placeholder">Variant-R needs JavaScript to load its data files.</p></noscript>
</body>
</html>
